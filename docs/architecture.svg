<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Ledgerlock architecture</title>
<desc id="d">Logs from Base Sepolia and Unichain Sepolia reach one reactive contract on Lasna, which requests pause callbacks to a gate on each chain; each gate pauses the bridge component.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#EAE3CC"/></marker>
<marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E4412A"/></marker></defs>
<rect width="960" height="520" fill="#182019"/>
<g fill="none" stroke="#85907F" stroke-width="1.5"><rect x="20" y="50" width="270" height="400" rx="6"/><rect x="345" y="50" width="270" height="400" rx="6"/><rect x="670" y="50" width="270" height="400" rx="6"/></g>
<g fill="#85907F" font-size="13" letter-spacing="1"><text x="34" y="74">BASE SEPOLIA 84532 (lock side)</text><text x="359" y="74">LASNA 5318007 (Reactive Omni)</text><text x="684" y="74">UNICHAIN SEPOLIA 1301 (mint side)</text></g>
<g fill="#182019" stroke="#EAE3CC" stroke-width="1.5">
<rect x="40" y="100" width="230" height="64" rx="4"/><rect x="40" y="200" width="230" height="64" rx="4"/><rect x="40" y="330" width="230" height="64" rx="4"/>
<rect x="690" y="100" width="230" height="64" rx="4"/><rect x="690" y="200" width="230" height="64" rx="4"/><rect x="690" y="330" width="230" height="64" rx="4"/>
<rect x="365" y="150" width="230" height="170" rx="4" stroke="#F1DE9C" stroke-width="2.5"/></g>
<g fill="#EAE3CC" font-size="14" font-weight="bold"><text x="55" y="126">LockBox / collateral router</text><text x="55" y="226">Gate B</text><text x="55" y="356">Bridge-side switch</text>
<text x="705" y="126">Minter / synthetic router</text><text x="705" y="226">Gate U</text><text x="705" y="356">Bridge-side switch</text>
<text x="380" y="178" fill="#F1DE9C">LedgerlockReactive</text></g>
<g fill="#85907F" font-size="12"><text x="55" y="146">emits Locked · Released</text><text x="55" y="246">callback target · isOpen()</text><text x="55" y="376">A: isOpen() check · B: PausableIsm</text>
<text x="705" y="146">emits Minted · Burned</text><text x="705" y="246">callback target · isOpen()</text><text x="705" y="376">A: isOpen() check · B: PausableIsm</text>
<text x="380" y="204">one ledger per route, both sides</text><text x="380" y="224">unmatched Minted → pause both gates</text><text x="380" y="244">matching Locked inside W → resume</text><text x="380" y="264">Released without Burned → pause</text><text x="380" y="284">no match, no callback sent</text><text x="380" y="304">acks + CallbackFailure watched</text></g>
<g stroke="#EAE3CC" stroke-width="1.8" fill="none" marker-end="url(#a)"><path d="M270 132 L365 190"/><path d="M690 132 L595 190"/></g>
<g stroke="#E4412A" stroke-width="2.2" fill="none" marker-end="url(#r)"><path d="M365 290 L270 232"/><path d="M595 290 L690 232"/></g>
<g stroke="#EAE3CC" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#a)"><path d="M155 264 L155 330"/><path d="M805 264 L805 330"/></g>
<g font-size="11" fill="#EAE3CC"><text x="300" y="150" text-anchor="middle">logs</text><text x="660" y="150" text-anchor="middle">logs</text>
<text x="165" y="300">flip</text><text x="815" y="300">flip</text></g>
<g fill="#E4412A" font-size="11"><text x="300" y="296" text-anchor="middle">pause cb</text><text x="660" y="296" text-anchor="middle">pause cb</text></g>
<text x="20" y="30" fill="#EAE3CC" font-size="18" font-weight="bold">Ledgerlock: one reactive contract watches both sides of the route</text>
<text x="20" y="490" fill="#85907F" font-size="12">Cream arrows: origin logs in. Red arrows: pause callbacks out (fire only on a mismatch). Dashed: the gate flips the bridge-side switch.</text>
<text x="20" y="508" fill="#85907F" font-size="11">Both pause callbacks come from one react() (requestCallbackV_1_0). Route A (fixture, ours) and route B (Hyperlane warp route, self-delivered) each have their own guard and gates.</text>
</svg>
