    <linearGradient id="i-sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EAE3CC" stop-opacity="0.07"/><stop offset="0.45" stop-color="#EAE3CC" stop-opacity="0"/></linearGradient>
    <linearGradient id="i-bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6F0DC"/><stop offset="0.5" stop-color="#EAE3CC"/><stop offset="1" stop-color="#F1DE9C"/></linearGradient>
