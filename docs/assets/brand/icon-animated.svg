<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ledgerlock — pauses a bridge seconds after it mints what was never locked. Minted on Unichain, never locked on Base: one react() turns both lamps from white to red, shutting both gates.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur). Same choreography table as readme-hero-animated.svg.
  0-10%   steady state: enamel plate, cream line, both section lamps warm white, the two gates short posts on the line (poster = line clear)
  10-25%  trigger:      a mint slides in from the Unichain end and lands in the right section; the right lamp flickers; the brass Lasna interlock pulses (it has seen the Minted log)   data-story="beat-2"
  25-55%  mechanism:    Minted on Unichain, never locked on Base: one react() turns both lamps from white to red, shutting both gates.   (react() ripple at 26%, two red pulses run out to the gates, gate B shuts at 30%, gate U at 32%: the real bu-015 order, B before U)   data-story="beat-3"
  55-80%  resolution:   held: both lamps stay red, a copycat mint arrives at the shut Unichain gate, flashes red and stops   data-story="beat-4"
  80-100% breathe + seam: red glow breath, then the owner's resolve() reopens the line at 86-92%; 92-100% equals the poster, so the loop seam is invisible
-->
