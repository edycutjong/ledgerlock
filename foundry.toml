[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[profile.default.fuzz]
runs = 256

# reactive-kit is a self-contained package; its own tests run under this profile.
[profile.kit]
src = "packages/reactive-kit/src"
test = "packages/reactive-kit/test"
script = "packages/reactive-kit/src"
out = "out-kit"

[fmt]
line_length = 120
